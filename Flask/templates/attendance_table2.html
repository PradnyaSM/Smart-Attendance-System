<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance Records</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
    <script>
        const socket = io();
        socket.on('database_update', (data) => {
            console.log("Database update detected:", data);
            alert("Database updated. Refreshing page...");
            location.reload();  // Automatically refresh the page
        });
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 8px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Attendance Records for {{ request.form['attendance_date'] }}</h1>
    <table>
        <tr>
            <th>Student ID</th>
            <th>Status</th>
            <th>Time</th>
        </tr>
        {% for record in records %}
        <tr>
            <td>{{ record._id }}</td>
            <td>{{ record.status }}</td>
            <td>{{ record.time }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
