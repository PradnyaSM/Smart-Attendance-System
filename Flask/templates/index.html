<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avg Attendance Records</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
             background: linear-gradient(135deg,#3a1c71 , #d76d77 , #ffaf7b);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            width: 90%;
            margin: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow-x: auto;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #3a1c71;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            overflow-x: auto;
        }
        th, td {
            padding: 12px 15px;
            border: 1px solid #ffaf7b;
            text-align: left;
        }
        th {
            background-color: #3a1c71;
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
        }
        tr:nth-child(even) {
            background-color: #ffaf7b;
        }
        tr:hover {
            background-color: #ffaf7b;
        }
        td {
            font-size: 0.95rem;
        }
        /* Responsive Design */
        @media (max-width: 768px) {
            th, td {
                padding: 10px 8px;
                font-size: 0.9rem;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Attendance Records</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Attendance Precentage</th>
                </tr>
            </thead>
            <tbody>
                {% for record in data %}
                    <tr>
                        <td>{{ record['_id'] }}</td>
                        <td>{{ record['name'] }}</td>
                        <td>{{ record['attendance_precentage'] }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
