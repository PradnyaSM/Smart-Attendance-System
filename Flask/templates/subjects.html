<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subjects</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg,#3a1c71 , #d76d77 , #ffaf7b);
            font-family: Arial, sans-serif;
            color: #fff;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .subject-list a button {
            display: inline-block;
            background-color: #ffffff;
            color: #4285f4;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin: 8px;
            transition: all 0.3s ease;
        }
        .subject-list a button:hover {
            background-color: #004e92;
            color: #fff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>You teach the following subjects to FY A</h1>
        <div class="subject-list">
            {% for subject in subjects %}
                <a href="{{ url_for('subject_page', subject_name=subject) }}"><button>{{ subject }}</button></a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
