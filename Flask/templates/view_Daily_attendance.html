<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Attendance - {{ subject }}</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #3a1c71, #d76d77, #ffaf7b);
            color: #ffffff;
        }
        .container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ffffff;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #ffffff;
        }
        input[type="date"] {
            padding: 8px;
            border-radius: 5px;
            border: none;
            font-size: 1rem;
            margin-bottom: 15px;
            width: 100%;
            max-width: 250px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            background-color: #ffffff;
            color: #4285f4;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #4285f4;
            color: #ffffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Daily Attendance for {{ subject }}</h1>
        <!-- <form action="/attendance_date" method="GET"> -->
        <form action="{{ url_for('show_attendance') }}" method="post">
            <label for="attendance_date">Select Date:</label>
            <input type="date" id="attendance_date" name="attendance_date" required>
            <button>submit</button>
        </form>
    </div>
</body>
</html>
