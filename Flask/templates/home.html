<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home | Smart Attendance System</title>
    <style>
        /* Reset some default browser styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Background styling */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* background: linear-gradient(135deg, #1a73e8, #4285f4, #34a853); */
            /* background: linear-gradient(135deg,#eecda3 , #ef629f); */
            background: linear-gradient(135deg,#3a1c71 , #d76d77 , #ffaf7b);
            color: #fff;
        }

        /* Centered container */
        .container {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Title styling */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* Button styling */
        a button {
            background-color: #ffffff;
            color: #4285f4;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Button hover effect */
        a button:hover {
            background-color: #004e92;
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Smart Attendance System</h1>
        <a href="{{ url_for('check_attendance') }}"><button>Check Attendance</button></a>
    </div>
</body>
</html>
